[package]
name = "multiseat-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Iced dashboard for RustMultiseat"

[[bin]]
name = "multiseat-gui"
path = "src/main.rs"

[dependencies]
multiseat-core = { workspace = true }
multiseat-daemon = { workspace = true }
clap = { workspace = true }
iced = { workspace = true }
tokio = { workspace = true }

# Tray is Windows-first (agent.md: one Win32 loop + channel into Iced).
# default-features off avoids pulling GTK/libxdo on hosts that only cross-check.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
